# =============================================================================
# Dynamo Router "on-ramp" — AGGREGATED, raw vanilla vLLM, no Dynamo control plane
# =============================================================================
#
# This is the minimal way to get Dynamo's KV-aware routing in front of an
# existing vanilla `vllm serve` fleet behind a Gateway-API gateway. It requires:
#
#   * NO Dynamo operator        (these are plain K8s objects, not a DynamoGraphDeployment)
#   * NO Dynamo runtime         (the EPP runs DistributedRuntime with the inert `mem`
#                                backend; DYN_EVENT_PLANE=zmq — no etcd, no NATS)
#   * NO Dynamo worker          (the workers are stock `vllm serve` pods)
#
# The only thing a team with an existing GAIE + vLLM setup changes is the
# `endpointPickerRef` of their InferencePool: point it at this EPP and you get
# token-aware, KV-cache-aware routing. Everything else (gateway, engines) is
# unchanged.
#
# How the EPP learns the cache state of each pod WITHOUT NATS:
#   - vanilla vLLM is started with `--kv-events-config` so it publishes native
#     KV-cache events on a ZMQ PUB socket (port 5557 below).
#   - the EPP runs in EXTERNAL mode (DYN_EPP_EXTERNAL=true): a Kubernetes pod
#     reflector (label selector DYN_EPP_POD_SELECTOR) discovers Ready vLLM pods,
#     and the EPP's in-process ZMQ wrapper subscribes to each pod's PUB socket,
#     normalizes the events and feeds them into the embedded KvRouter's index.
#
# Prereqs (install once, independent of this file):
#   deploy/inference-gateway/scripts/install_gaie_crd_agentgateway.sh
#   (Gateway API + Gateway-API-Inference-Extension CRDs + a gateway named
#    `inference-gateway`)
#
# Apply:   kubectl apply -n <ns> -f agg.yaml
# Test:    curl http://<gateway>/v1/chat/completions -d '{"model":"Qwen/Qwen3-0.6B",...}'
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# 1) Raw vanilla vLLM workers (aggregated: prefill+decode in one process).
#    Stock vllm/vllm-openai image — NOT a Dynamo worker.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  labels:
    app: vllm-qwen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # Enable prefix caching + native KV-cache events on a ZMQ PUB socket.
          # The EPP subscribes to tcp://<pod-ip>:5557 to learn cached prefixes.
          # --block-size MUST match the EPP's DYN_KV_CACHE_BLOCK_SIZE below.
          args:
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--served-model-name"
            - "Qwen/Qwen3-0.6B"
            - "--port"
            - "8000"
            - "--enable-prefix-caching"
            - "--block-size"
            - "16"
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"endpoint":"tcp://*:5557"}'
          ports:
            - name: http
              containerPort: 8000
            - name: kv-events
              containerPort: 5557
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists

---
# -----------------------------------------------------------------------------
# 2) RBAC: the EPP's pod reflector needs to list/watch the vLLM pods, and read
#    its own InferencePool. (The Dynamo operator would normally create these.)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen-epp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen-epp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen-epp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen-epp
subjects:
  - kind: ServiceAccount
    name: qwen-epp

---
# -----------------------------------------------------------------------------
# 3) The Dynamo Rust EPP, in EXTERNAL (on-ramp) mode.
#    This is the ONLY Dynamo component in the whole topology.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-epp
  labels:
    app: qwen-epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-epp
  template:
    metadata:
      labels:
        app: qwen-epp
    spec:
      serviceAccountName: qwen-epp
      containers:
        - name: epp
          image: nvcr.io/nvidia/ai-dynamo/epp-image:my-tag
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
          env:
            # --- EXTERNAL / on-ramp mode switch ---------------------------------
            - name: DYN_EPP_EXTERNAL
              value: "true"
            # Label selector used by the pod reflector to find raw vLLM pods.
            - name: DYN_EPP_POD_SELECTOR
              value: "app=vllm-qwen"
            # The vLLM OpenAI HTTP port the gateway forwards to (pool targetPort).
            - name: DYN_EPP_TARGET_PORT
              value: "8000"
            # --- precise KV routing from vLLM's native ZMQ events ---------------
            - name: DYN_EPP_KV_EVENTS
              value: "true"
            - name: DYN_EPP_KV_EVENT_PORT
              value: "5557"
            # vLLM's --kv-events-config topic ("" = no topic prefix, the default).
            - name: DYN_EPP_KV_EVENT_TOPIC
              value: ""
            # The EPP has no Dynamo model card in external mode, so the model
            # name + block size are provided explicitly. block size MUST equal
            # vLLM's --block-size.
            - name: DYN_MODEL_NAME
              value: "Qwen/Qwen3-0.6B"
            - name: DYN_KV_CACHE_BLOCK_SIZE
              value: "16"
            - name: DYN_OVERLAP_SCORE_WEIGHT
              value: "1.0"
            # --- inert runtime: NO etcd, NO NATS --------------------------------
            - name: DYN_DISCOVERY_BACKEND
              value: "mem"
            - name: DYN_EVENT_PLANE
              value: "zmq"
            # The pod reflector reads its own namespace from the downward API.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: "info,dynamo_llm::kv_router=debug"
            # HF token: the EPP downloads the tokenizer for the model to tokenize
            # prompts for routing (no GPU needed; the worker re-tokenizes).
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: qwen-epp
spec:
  selector:
    app: qwen-epp
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
      appProtocol: http2

---
# -----------------------------------------------------------------------------
# 4) GAIE InferencePool — selects the raw vLLM pods and delegates endpoint
#    selection to the Dynamo EPP. THIS is the single line an existing GAIE user
#    changes: endpointPickerRef -> the Dynamo EPP service.
# -----------------------------------------------------------------------------
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: qwen-pool
spec:
  targetPorts:
    - number: 8000
  selector:
    matchLabels:
      app: vllm-qwen
  endpointPickerRef:
    kind: Service
    name: qwen-epp
    port:
      number: 9002

---
# -----------------------------------------------------------------------------
# 5) HTTPRoute — attach the pool to the cluster gateway.
# -----------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qwen-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: qwen-pool
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 300s
